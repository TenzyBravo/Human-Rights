; PHP limits for shared hosting running PHP-FPM / CGI, where the php_flag and
; php_value directives in .htaccess are not available.
;
; cPanel reads .user.ini per-directory. Changes can take up to 5 minutes to
; apply (user_ini.cache_ttl), or restart PHP from cPanel to apply immediately.
display_errors = Off
log_errors = On
upload_max_filesize = 20M
post_max_size = 60M
max_file_uploads = 12
max_execution_time = 60
memory_limit = 256M

; Session hardening. The application also sets these at runtime in Session.php,
; so this is defence in depth rather than the only line of protection.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
